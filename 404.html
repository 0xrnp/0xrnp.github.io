<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex">
<title>404 · 0xrnp</title>
<style>
  :root { --bg: #f4f2ee; --ink: #22252b; --muted: #595e68; --accent: #a8431a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171b; --ink: #dfe2e7; --muted: #8b919c; --accent: #f0905a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  main { max-width: 46rem; margin: 0 auto; padding: 3.5rem 1.25rem; }
  h1 { font: 400 clamp(2rem, 8vw, 3.2rem)/1.1 Georgia, serif; margin: 0 0 1rem; }
  .cmd { color: var(--accent); }
  p { margin: 0 0 1rem; }
  .muted { color: var(--muted); }
  a { color: var(--accent); text-underline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p><span class="cmd">$</span> cat this-page<br>cat: this-page: No such file or directory</p>
  <p class="muted">The page you wanted is missing, moved, or never existed.</p>
  <p><a href="/">cd ~</a></p>
</main>
</body>
</html>
